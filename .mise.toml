[tools]
go = "1.25.5"
golangci-lint = "2.5.0"
kind = "0.31.0"
kubectl = "1.31.1"
yq = "4.44.3"
helm = "3.19.4"
kustomize = "5.8.1"
# e2e lint adapter dependencies (scripts/lint-*.sh in the e2e submodule)
kyverno = "1.18.2"
conftest = "0.68.2"
jq = "1.8.2"

[env]
# e2e kind node image (k8s version + digest): part of the e2e expected-output
# contract - bumping it requires regenerating e2e expectations (see e2e/README.md)
E2E_KIND_NODE_IMAGE = "kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256"
# ArgoCD version installed in the e2e cluster - keep in sync with the
# github.com/argoproj/argo-cd version in go.mod
E2E_ARGOCD_VERSION = "v3.3.11"
BINARY_NAME = "argocdf"

[tasks.build]
description = "Build the binary"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -ldflags "-X main.Version=$VERSION" -o $BINARY_NAME ./cmd/argocdf
"""

[tasks.build-all]
description = "Build for multiple platforms"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
LDFLAGS="-X main.Version=$VERSION"
GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ${BINARY_NAME}-darwin-amd64 ./cmd/argocdf
GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o ${BINARY_NAME}-darwin-arm64 ./cmd/argocdf
GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ${BINARY_NAME}-linux-amd64 ./cmd/argocdf
GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o ${BINARY_NAME}-linux-arm64 ./cmd/argocdf
"""

[tasks.install]
description = "Install to GOPATH/bin"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go install -ldflags "-X main.Version=$VERSION" ./cmd/argocdf
"""

[tasks.test]
description = "Run tests"
run = "go test -v ./..."

[tasks.test-coverage]
alias = "coverage"
description = "Run tests with coverage"
run = """
go test -coverprofile=coverage.out ./...
go tool cover -html=coverage.out -o coverage.html
"""

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
alias = "format"
description = "Format code"
run = """
go fmt ./...
goimports -w .
"""

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.deps]
description = "Download dependencies"
run = "go mod download"

[tasks.tidy]
description = "Tidy dependencies"
run = "go mod tidy"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -f $BINARY_NAME
rm -f ${BINARY_NAME}-*
rm -f coverage.out coverage.html
rm -f argocdf-report.html
"""

[tasks.dev]
description = "Run in development mode"
run = "go run ./cmd/argocdf"

[tasks.check]
alias = "ci"
description = "Run all checks (vet, lint, test)"
depends = ["vet", "lint", "test"]

[tasks."e2e:bootstrap"]
description = "Bootstrap the e2e cluster with the REAL ArgoCD controller (the baseline: production-shaped). Requires e2e master pushed, because the controller syncs the remote at targetRevision HEAD. Waits until every Application is Synced+Healthy (E2E_SYNC_TIMEOUT bounds it). REFUSES to run when the cluster is already alive - reuse it with e2e:bootstrap-static, or e2e:clean first"
run = """
#!/usr/bin/env bash
set -euo pipefail

# init only when missing: `submodule update` on an initialized submodule would
# RESET its checkout to the recorded gitlink, clobbering local e2e work
[ -e e2e/.git ] || git submodule update --init --recursive
scripts/e2e/bootstrap.sh
"""

[tasks."e2e:bootstrap-static"]
description = "e2e cluster WITHOUT a controller: same Application set, applied once by rendering the charts. Needs no push and no sync wait - the fast loop for fixtures and regeneration (output is identical to the baseline). REFUSES a controller-backed cluster: it would not uninstall the controller, which then reverts the applied app set on the next remote revision"
run = """
#!/usr/bin/env bash
set -euo pipefail

[ -e e2e/.git ] || git submodule update --init --recursive
scripts/e2e/bootstrap.sh --static
"""

[tasks."e2e:run"]
description = "Run the e2e suite: every case branch diffed against expected outputs (the e2e:review hollow-pin gate runs automatically after a full run). Against the controller-backed baseline, push e2e master first (e2e:push) and let it sync"
depends = ["build"]
run = "scripts/e2e/run.sh"

[tasks."e2e:regenerate"]
description = "Regenerate e2e expected outputs from the current binary (review the diff before committing! the e2e:review hollow-pin gate runs automatically on the result). Use the e2e:bootstrap-static cluster: no push needed and the output is identical"
depends = ["build"]
run = "scripts/e2e/run.sh --regenerate"

[tasks."e2e:review"]
description = "Hollow-pin guard: mechanically review e2e/expected/ against each case's authored checks (expected/<case>/checks.grep) and global never-pin rules"
run = "scripts/e2e/review-expected.sh"

[tasks."e2e:push"]
description = "Publish the e2e artifact: rebase all case/* branches onto master, push master, force-push branches, prune orphaned remote case branches. Run it as: E2E_PUSH_YES=1 mise run e2e:push - mise gives the task no TTY, so the confirmation prompt only appears when scripts/e2e/push.sh is invoked directly"
run = "scripts/e2e/push.sh"

[tasks."e2e:clean"]
description = "Destroy e2e test environment"
run = """
#!/usr/bin/env bash
set -euo pipefail

kind delete cluster -n argocdf
"""
