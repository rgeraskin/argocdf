name: release

"on":
  push:
    # run only against version tags
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          # go compiles, goreleaser orchestrates — BOTH pinned in .mise.toml, so
          # `mise exec -- goreleaser release --clean` reproduces this job byte for
          # byte on a laptop. That is why goreleaser-action was dropped: its
          # `version:` input put a second, invisible pin in a file nobody reads
          # when reproducing a release. The GoReleaser pin's "do not bump
          # blindly" rationale now lives beside the version, in .mise.toml.
          # The release path runs no tests, so helm/kustomize/golangci-lint
          # stay out.
          install_args: go goreleaser
      - name: Resolve Go module cache path
        # Computed, not hardcoded to ~/go/pkg/mod: mise owns the Go install, and
        # a cache path that does not exist stores NOTHING while still reporting
        # success — a silent no-op is the failure mode worth spending 2 lines on.
        run: echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          # Modules ONLY, deliberately not GOCACHE: a six-target cross-compile
          # build cache is large and near-worthless across releases (every tag is
          # a different commit), so caching it would burn the repo's shared 10GB
          # budget and evict ci.yml's entries in exchange for nothing. Its own
          # key namespace for the same reason — release must not overwrite the
          # entry CI depends on.
          path: ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-gomod-release-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-release-
      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          # GH_PAT needs `contents: write` on this repo and the homebrew tap
          # repo so GoReleaser can push the generated Formula.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
