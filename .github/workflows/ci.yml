name: ci

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Do not init the e2e submodule: it is an SSH-only fixtures repo with no
        # Go sources, so `go test ./...` never needs it and cloning would fail.
        with:
          submodules: false
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          # go + golangci-lint + deadcode for the toolchain; helm + kustomize so
          # the render integration tests actually run instead of t.Skip()-ing.
          # kind/kubectl/yq stay out (e2e-only). Versions come from .mise.toml.
          install_args: go golangci-lint go:golang.org/x/tools/cmd/deadcode helm kustomize
      - name: Resolve Go cache paths
        # Computed rather than hardcoded to ~/go/pkg/mod: mise controls the Go
        # install, and a path that does not exist caches NOTHING while still
        # reporting success — a silent no-op is the failure mode to avoid here.
        run: |
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GOMODCACHE }}
            ${{ env.GOCACHE }}
          # .mise.toml is in the key because the build cache is TOOLCHAIN-specific:
          # a Go bump must start a fresh lineage rather than restore entries the
          # new compiler cannot reuse. go.sum keys the module half; restore-keys
          # lets a dependency change still reuse the previous run's downloads.
          key: ${{ runner.os }}-go-${{ hashFiles('.mise.toml') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('.mise.toml') }}-
      # Every step below is a mise task, so `mise run check` reproduces this job
      # on a laptop: the `check` task's `depends` lists exactly these tasks, and
      # adding a step here means adding it there (and vice versa). The steps stay
      # separate rather than one `mise run check` so a red step names itself, and
      # so lint can still run after a failed test.
      - name: Vet
        run: mise run vet
      - name: Build
        run: mise run build
      - name: Test
        # The task passes -v so t.Skip()'d integration tests are visible in the
        # log; with mise installing helm+kustomize, none should skip anymore.
        run: mise run test
      - name: Test under the race detector
        # ~10x slower than `test`, which is why it is a separate task and step.
        run: mise run test-race
      - name: Dead code
        # Whole-program reachability (exported symbols included); the default
        # `unused` linter only sees unexported ones. The task allowlists the one
        # deliberate marker method.
        run: mise run deadcode
      - name: Lint
        # Runs even when the steps above failed: a red test must not hide lint
        # findings. `!cancelled()` rather than `always()`, so cancelling a run
        # actually stops it. The steps above stay fail-fast on purpose — they
        # share one compile, so a broken build reddening every step is noise.
        if: ${{ !cancelled() }}
        run: mise run lint
